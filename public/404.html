<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Facility Profiling - Redirecting</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // This script takes the current URL and converts the path and query
    // string into just a hash fragment, then redirects to the root
    // which allows index.html to handle the URL.
    var pathSegmentsToKeep = 1;

    var l = window.location;
    var segmentCount = l.pathname.split('/').length;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <h1>Redirecting...</h1>
  <p>If you are not redirected automatically, <a href="https://zeeshanfr472.github.io/facility-profiling-frontend-map">click here</a>.</p>
</body>
</html>
